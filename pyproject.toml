[build-system]
# stream-ep's setup.py imports `torch.utils.cpp_extension.{BuildExtension,CUDAExtension}`
# at the top, so torch must be importable when uv prepares the wheel metadata.
# Builds run with `--no-build-isolation` in pixi.toml's env (or the consumer's
# env), which already provides the pinned torch; the requires line documents
# the contract and lets pure-isolation builds find the deps too.
requires = ["setuptools>=77", "wheel", "torch==2.11.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-ep"
version = "0.1.14"
# The compiled extension is ABI-bound to the torch it was built against and
# statically links NVSHMEM's device library, so both are pinned to the exact
# versions in pixi.toml's build env: a consumer env with different versions
# fails to resolve instead of failing at import. The torch edge also makes uv
# install torch before stream-ep's metadata prep under no-build-isolation.
dependencies = ["torch==2.11.0", "nvidia-nvshmem-cu13==3.4.5"]

[tool.ruff]
# Matches .clang-format's ColumnLimit.
line-length = 140

[tool.ruff.lint]
select = [
    # pycodestyle
    "E", "W",
    # Pyflakes
    "F",
    # pyupgrade
    # "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    # "I",
]
ignore = [
    # Module level import not at top of file
    "E402",
    # star imports
    "F405", "F403",
    # ambiguous name
    "E741",
    # line too long
    "E501",
    # key in dict.keys()
    "SIM118",
    # ternary vs if/else is left to the author
    "SIM108",
    # memory leaks
    "B019",
    # No such file or directory
    "E902",
]
exclude = [
    "stream_ep/__init__.py"
]

[tool.pytest.ini_options]
# Dump every thread's stack when a test stalls, before the 5-minute
# process-group timeout ends a hung distributed run.
faulthandler_timeout = 240
