# Wheel build env. The wheel is consumed by evoscale, so every pin below that
# reaches the compiled extension must match evoscale's env: python 3.12, torch
# 2.11.0+cu130 (C++ ABI of libtorch/libc10), nvcc 13.3 (cudart 13 soname), and
# nvidia-nvshmem-cu13 3.4.5 (device lib is linked statically, host lib is
# loaded from the consumer's env). pyproject.toml declares the same torch /
# nvshmem pins as runtime requirements, so a mismatched consumer fails to
# resolve instead of crashing at import.
[workspace]
name = "stream-ep"
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
libc = "2.28"

[dependencies]
python = "3.12.*"
cxx-compiler = "*"
gxx_linux-64 = "14.3.*"  # evoscale's compiler
cuda-version = "13.3.*"
cuda-compiler = "13.3.*"
cuda-cudart-dev = "13.3.*"
cuda-driver-dev = "13.3.*"
cuda-nvtx-dev = "13.3.*"
libcublas-dev = "*"
libcusolver-dev = "*"
libcusparse-dev = "*"
ninja = "*"
patchelf = "*"
pip = "*"
rdma-core = "*"  # infiniband/mlx5dv.h, included by NVSHMEM's IBGDA headers
setuptools = ">=77,<82"  # torch 2.11 requires setuptools<82
wheel = "*"

[pypi-dependencies]
torch = { version = "==2.11.0", index = "https://download.pytorch.org/whl/cu130" }
nvidia-nvshmem-cu13 = "==3.4.5"

[activation.env]
CUDA_HOME = "$CONDA_PREFIX"
TORCH_CUDA_ARCH_LIST = "9.0"

[tasks.build-wheel]
cmd = "python scripts/build_wheel.py"
description = "Build the release wheel into dist/"

[tasks.check-wheel]
cmd = "python scripts/check_wheel.py"
description = "Check dist/ holds one release-ready wheel matching pyproject's version"

# Dev / GPU-test env: the build env plus the runtime-only deps of the
# streaming-MoE kernels, at the same pins as evoscale (the quack fork rev and
# cutlass-dsl come from evoscale's pixi.toml). stream-ep itself is an editable
# install built by the env, so `build-ext` followed by a test task runs the
# working tree.
[feature.test.pypi-dependencies]
stream-ep = { path = ".", editable = true }
quack-kernels = { git = "https://github.com/evolutionaryscale/quack.git", rev = "1843cb2b9c698cdaddc27cb92026740d88d24624", extras = ["cu13", "heuristics"] }
nvidia-cutlass-dsl = { version = "==4.7.0", extras = ["cu13"] }
pytest = "*"

# evoscale lifts torch's cuda-toolkit==13.0.2 to the 13.3 runtime (its conda
# cuda-version pin holds it at 13.3); mirror that so tests run on the same CUDA
# runtime and CuTeDSL bindings. NCCL / cuDNN / tvm-ffi use evoscale's ranges
# and may sit a patch or minor ahead of its lock.
[feature.test.pypi-options.dependency-overrides]
cuda-toolkit = { version = ">=13.3,<13.4", extras = ["cublas", "cudart", "cufft", "cufile", "cupti", "curand", "cusolver", "cusparse", "nvjitlink", "nvrtc", "nvtx"] }
cuda-bindings = ">=13.3,<13.4"
cuda-python = ">=13.3,<13.4"
nvidia-nccl-cu13 = ">=2.30.4,<3"
nvidia-cudnn-cu13 = ">=9.23.2,<10"
apache-tvm-ffi = ">=0.1.12,<0.2"

# setup.py imports torch, so build stream-ep against this env's torch.
[feature.test.pypi-options]
no-build-isolation = ["stream-ep"]

[feature.test.tasks.build-ext]
cmd = "python setup.py build_ext --inplace"
description = "Incremental in-place build of stream_ep_cpp after .cu / .cpp / .cuh edits"

[feature.test.tasks.test-kernels]
cmd = "pytest stream_ep/stream_moe/tests"
description = "Single-process kernel pytest suite (1 GPU)"

[feature.test.tasks.test-dist]
args = ["script", { arg = "nproc", default = "8" }]
cmd = "torchrun --standalone --nproc-per-node={{ nproc }} {{ script }}"
description = "Run one torchrun test script on this node, e.g. `pixi run -e test test-dist tests/test_dispatch.py`"

[feature.lint.dependencies]
pre-commit = "*"

[feature.lint.tasks.lint]
cmd = "pre-commit run --all-files"
description = "Run the pre-commit hooks (ruff, config checks) on the whole repo"

[environments]
test = ["test"]
lint = { features = ["lint"], no-default-feature = true }
