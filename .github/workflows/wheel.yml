name: Wheel

# Every PR builds and checks the wheel. A push to main (or a manual run) whose
# pyproject.toml version has no release yet publishes that wheel as the single
# asset of release v<version>; otherwise it builds and stops there.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheel-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The build env (CUDA toolkit + torch + NVSHMEM) is ~7 GB.
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.70.2
          locked: true
          cache: false

      - run: pixi run build-wheel
      - run: pixi run check-wheel

      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - id: version
        run: echo "tag=v$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"

      # Release assets are immutable: uv caches wheel URLs, so a re-upload under
      # an existing tag would leave consumers on the stale build.
      - id: exists
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "::notice::${{ steps.version.outputs.tag }} already exists; nothing to release"
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.released != 'true'
        uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist

      - if: steps.exists.outputs.released != 'true'
        run: >
          gh release create "${{ steps.version.outputs.tag }}" dist/*.whl
          --target "${{ github.sha }}"
          --title "${{ steps.version.outputs.tag }}"
          --generate-notes
