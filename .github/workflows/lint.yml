name: Lint

# Same hooks as local pre-commit (.pre-commit-config.yaml), via the small
# `lint` pixi env so this job never downloads the CUDA build env.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.70.2
          environments: lint
          locked: true

      - run: pixi run -e lint lint
